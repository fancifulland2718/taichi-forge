name: Build Python shim wheels

# Build/install validation only. release.yml owns coordinated publication.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      runtime_version:
        required: true
        type: string
      runtime_source:
        type: string
        default: artifact
      runtime_run_id:
        type: string
        required: true
      validation_platform:
        type: string
        default: all
      target:
        type: string
        default: pypi
      wheel_run_id:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.7.0 or 0.7.0rc1); leave empty to use version.txt"
        required: false
        default: ""
      runtime_version:
        description: "Exact compatible runtime version; blank matches version (tags use package metadata)"
        required: false
        default: ""
      runtime_source:
        description: "Use an existing runtime from the index or an Actions artifact (never rebuilds it)"
        type: choice
        options: [index, artifact]
        default: index
      validation_platform:
        description: "Validation scope; Windows-only runs never publish"
        type: choice
        options: [all, windows]
        default: all
      runtime_run_id:
        description: "Actions run ID, e.g. 35196322756, NOT a version; only for runtime_source=artifact"
        type: string
        required: false
        default: ""
      target:
        description: "Index used only when runtime_source=index"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      wheel_run_id:
        description: "Reuse validated shim wheels for inspection; blank builds new shims"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-wheel-release-${{ github.ref }}-${{ github.event.inputs.version || 'version-file' }}
  cancel-in-progress: false

env:
  TI_SKIP_VERSION_CHECK: "ON"
  TI_CI: "1"
  # LLVM 20 prebuilt asset tag shipped via Build LLVM workflow.
  # Required so the workflow can download the prebuilt LLVM zip instead of
  # spending ~20 minutes rebuilding it in-job.
  LLVM20_WIN_URL: ${{ vars.LLVM20_WIN_URL }}
  LLVM20_LINUX_MANYLINUX_URL: ${{ vars.LLVM20_LINUX_MANYLINUX_URL }}
  LLVM20_WIN_SHA256: ${{ vars.LLVM20_WIN_SHA256 }}
  LLVM20_LINUX_SHA256: ${{ vars.LLVM20_LINUX_SHA256 }}

jobs:
  resolve_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      runtime_version: ${{ steps.set.outputs.runtime_version }}
      runtime_source: ${{ steps.set.outputs.runtime_source }}
      target: ${{ steps.set.outputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: set
        env:
          VALIDATION_PLATFORM: ${{ inputs.validation_platform || 'all' }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
          REQUEST_VERSION: ${{ inputs.version }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          RUNTIME_SOURCE: ${{ inputs.runtime_source || 'index' }}
          TARGET: ${{ inputs.target || 'pypi' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VALIDATION_PLATFORM" in all|windows) ;; *) echo "Invalid validation platform"; exit 1 ;; esac
          case "$RUNTIME_SOURCE" in index|artifact) ;; *) echo "Invalid runtime source; build native runtime separately"; exit 1 ;; esac
          case "$TARGET" in pypi|testpypi) ;; *) echo "Invalid package index"; exit 1 ;; esac
          if [[ "$RUNTIME_SOURCE" == artifact ]]; then
            [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]] || { echo "runtime_run_id must be an Actions run ID (e.g. 35196322756), not a version; put 0.7.0 in runtime_version"; exit 1; }
          elif [[ -n "$RUNTIME_RUN_ID" ]]; then
            echo "runtime_run_id requires runtime_source=artifact"; exit 1
          fi
          if [[ -n "$WHEEL_RUN_ID" ]]; then
            [[ "$WHEEL_RUN_ID" =~ ^[0-9]+$ ]] || { echo "wheel_run_id must be an Actions run ID, not a version"; exit 1; }
            if [[ "$VALIDATION_PLATFORM" != all || "$RUNTIME_SOURCE" != index ]]; then
              echo "Reusing validated shims requires validation_platform=all and runtime_source=index"; exit 1
            fi
          fi
          if [[ -n "$REQUEST_VERSION" ]]; then
            ver="$REQUEST_VERSION"
          else
            ver="$(tr -d ' \t\n' < version.txt)"
          fi
          ver="${ver#forge-v}"
          ver="${ver#v}"
          runtime_ver="${RUNTIME_VERSION:-$ver}"
          runtime_ver="${runtime_ver#forge-v}"
          runtime_ver="${runtime_ver#v}"
          python -c "from scripts.sync_runtime_dependency import _version_parts; import sys; [_version_parts(v) for v in sys.argv[1:]]" "$ver" "$runtime_ver"
          echo "Resolved version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$runtime_ver" >> "$GITHUB_OUTPUT"
          echo "runtime_source=$RUNTIME_SOURCE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Build/validate only; release.yml owns publication." >> "$GITHUB_STEP_SUMMARY"

  build_linux:
    name: Linux wheel (py${{ matrix.python }})
    if: ${{ inputs.validation_platform != 'windows' && !inputs.wheel_run_id }}
    needs: resolve_version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy_min: "1.23.5"
            numpy_min_major: "1"
          - python: "3.11"
            numpy_min: "1.23.5"
            numpy_min_major: "1"
          - python: "3.12"
            numpy_min: "1.26.0"
            numpy_min_major: "1"
          - python: "3.13"
            numpy_min: "2.1.0"
            numpy_min_major: "2"
          - python: "3.14"
            numpy_min: "2.3.4"
            numpy_min_major: "2"
    env:
      PY: ${{ matrix.python }}
      # No CMAKE_POLICY_VERSION_MINIMUM shim: we instead pin cmake<4 in the
      # build deps below (mirrors the local VS2026-bundled CMake 3.x which
      # is the configuration we validate against).
      #
      # IMPORTANT: must be CMAKE_ARGS (read by scikit-build-core), NOT
      # TAICHI_CMAKE_ARGS (only honored by the legacy setup.py build,
      # which no longer exists after the scikit-build-core migration).
      # Setting TAICHI_CMAKE_ARGS here is a silent no-op and produces a
      # wheel with all backends OFF (no GGUI or CUDA).
      # The Python PyPI wheel intentionally omits the C API package tree to
      # keep per-release PyPI storage bounded; C API artifacts should be built
      # and distributed separately when needed.
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_RUNTIME_C_API:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build ccache libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libx11-dev \
            libxrender-dev libgl-dev libtinfo-dev libxml2-dev

      - name: Install Vulkan SDK deps
        if: runner.os == 'Linux'
        env:
          VULKAN_SDK_VERSION: "1.4.304.1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools xz-utils

          sdk_root="$RUNNER_TEMP/vulkan-sdk"
          sdk_archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          curl -fsSL \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz" \
            -o "$sdk_archive"
          echo "92d698f12a968b024e2b593037830262785b2b734553683457719d4da7c5b0d6  $sdk_archive" | sha256sum -c -
          rm -rf "$sdk_root"
          mkdir -p "$sdk_root"
          tar -xJf "$sdk_archive" -C "$sdk_root" --strip-components=1

          sdk="$sdk_root/x86_64"
          test -x "$sdk/bin/glslc"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "VK_SDK_PATH=$sdk" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/glslc" --version

      - name: Download prebuilt LLVM 20
        env:
          LLVM20_LINUX_URL: ${{ vars.LLVM20_LINUX_URL || env.LLVM20_LINUX_MANYLINUX_URL }}
          LLVM20_LINUX_SHA256: ${{ env.LLVM20_LINUX_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${LLVM20_LINUX_URL}" ]]; then
            echo "::error::LLVM20_LINUX_URL (or LLVM20_LINUX_MANYLINUX_URL) is not configured as a repository variable."
            echo "  Go to Settings → Secrets and variables → Actions → Variables and add the URL."
            exit 1
          fi
          if [[ ! "${LLVM20_LINUX_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::LLVM20_LINUX_SHA256 must be configured as a 64-character repository variable."
            exit 1
          fi
          mkdir -p dist
          curl -fsSL "$LLVM20_LINUX_URL" -o /tmp/llvm20.zip
          echo "${LLVM20_LINUX_SHA256,,}  /tmp/llvm20.zip" | sha256sum -c -
          mkdir -p dist/taichi-llvm-20
          python -m zipfile -e /tmp/llvm20.zip dist/taichi-llvm-20
          echo "LLVM_DIR=$GITHUB_WORKSPACE/dist/taichi-llvm-20/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install python build deps
        run: |
          python -m pip install "pip==26.2.1"
          # numpy is imported by cmake/PythonNumpyPybind11.cmake at configure
          # time to resolve the numpy include dir.
          #
          # cmake<4 is REQUIRED: vendored external/SPIRV-Tools and other
          # third-party trees still use cmake_minimum_required(VERSION <3.5),
          # which CMake 4 refuses outright. The local Windows build uses the
          # CMake 3.x bundled with Visual Studio 2026; we mirror that here.
          python -m pip install --requirement packaging/constraints/release-build.txt
          python -c "import sys, sysconfig; print(sys.version); print(sysconfig.get_config_var('SOABI'))"
          python -m pip freeze

      - name: Override version
        shell: bash
        run: |
          echo -n "${{ needs.resolve_version.outputs.version }}" > version.txt
          cat version.txt
          python scripts/sync_runtime_dependency.py --runtime-version "${{ needs.resolve_version.outputs.runtime_version }}"

      - name: Download published runtime for shim link
        if: ${{ needs.resolve_version.outputs.runtime_source == 'index' }}
        shell: bash
        run: |
          index_url=https://pypi.org/simple/
          if [[ "${{ needs.resolve_version.outputs.target }}" == testpypi ]]; then index_url=https://test.pypi.org/simple/; fi
          python -m pip download --only-binary=:all: --no-deps --index-url "$index_url" \
            "taichi-forge-runtime==${{ needs.resolve_version.outputs.runtime_version }}" -d runtime-wheel

      - name: Download runtime artifact for shim link
        if: ${{ needs.resolve_version.outputs.runtime_source != 'index' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-runtime
          path: runtime-wheel
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}

      - name: Extract runtime artifact for shim link
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-link

          python scripts/validate_runtime_wheel.py \
            --wheel-dir runtime-wheel --platform manylinux \
            --version "${{ needs.resolve_version.outputs.runtime_version }}" \
            --dependency-class driver-only --export-manifest-schema 2 \
            --strict-binary

          python - <<'PY'
          from pathlib import Path
          from shutil import copyfileobj
          from zipfile import ZipFile

          wheels = sorted(Path("runtime-wheel").glob("taichi_forge_runtime-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one runtime wheel, found {len(wheels)}: {wheels}")

          with ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              members = [
                  name for name in names
                  if name == "taichi_forge_runtime/_lib/runtime_native/libtaichi_runtime.so"
              ]
              if len(members) != 1:
                  raise SystemExit(
                      "Expected the canonical Linux runtime SO required by the "
                      f"shim DT_NEEDED contract in {wheels[0]}, found {members}"
                  )
              target = Path("runtime-link/libtaichi_runtime.so")
              with zf.open(members[0]) as src, target.open("wb") as dst:
                  copyfileobj(src, dst)
              print(f"Extracted {members[0]} from {wheels[0]} -> {target}")
          PY

          runtime_dir="$(realpath runtime-link)"
          echo "CMAKE_ARGS=${CMAKE_ARGS} -DTI_PREBUILT_PYTHON_RUNTIME_DIR=${runtime_dir}" >> "$GITHUB_ENV"
          ls -la runtime-link

      - name: Build wheel
        # `python -I -m build` runs in isolated mode, which drops cwd from
        # sys.path[0] so the repo-local build.py does not shadow the PyPI
        # `build` package.
        run: |
          python -I -m build --wheel --no-isolation

      - name: Audit wheel (auditwheel repair)
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          # ubuntu-22.04 ships glibc 2.35, so the wheel will reference glibc 2.35
          # symbols.  auditwheel repair --plat manylinux_2_28_x86_64 would fail because
          # 2.28 < 2.35.  Use manylinux_2_35_x86_64 which PyPI accepts (PEP 600).
          # To produce a more-compatible manylinux_2_28 wheel, switch the build_linux
          # job to run inside a quay.io/pypa/manylinux_2_28_x86_64 container instead.
          auditwheel show dist/*.whl || true
          auditwheel repair dist/*.whl -w wheelhouse/ \
            --plat manylinux_2_35_x86_64 \
            --exclude libtaichi_runtime.so
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("wheelhouse").glob("*.whl"))
          if not wheels:
              raise SystemExit("No repaired Python wheels found")
          for wheel in wheels:
              if "linux_x86_64" in wheel.name or "manylinux" not in wheel.name:
                  raise SystemExit(f"Unsupported Linux Python wheel tag: {wheel.name}")
              print(f"Linux Python upload candidate: {wheel.name}")
          PY

      - name: Validate installed runtime and shim wheels
        env:
          TI_NATIVE_RUNTIME_LOAD_TRACE: "1"
        run: |
          set -euo pipefail
          python_tag="cp${PY/./}"
          python scripts/validate_shim_wheel.py \
            --wheel-dir wheelhouse --platform manylinux \
            --python-tag "$python_tag" --runtime-version "${{ needs.resolve_version.outputs.runtime_version }}" --strict-binary
          python -m pip install --force-reinstall --only-binary=:all: \
            --constraint packaging/constraints/release-build.txt \
            runtime-wheel/*.whl wheelhouse/*.whl
          python -m pip check
          mkdir -p numpy-compat-results
          cd /tmp
          python -I -u -X faulthandler "$GITHUB_WORKSPACE/scripts/validate_installed_runtime.py"
          python -I -u -X faulthandler "$GITHUB_WORKSPACE/scripts/validate_runtime_load_order.py"
          python -I -u "$GITHUB_WORKSPACE/scripts/validate_numpy_abi.py" --expected-major 2
          python -I -u "$GITHUB_WORKSPACE/benchmarks/numpy_abi_compat_bench.py" \
            --label "build-numpy" \
            --output "$GITHUB_WORKSPACE/numpy-compat-results/build.json"
          python -m pip install --force-reinstall --no-deps "numpy==${{ matrix.numpy_min }}"
          python -I -u "$GITHUB_WORKSPACE/scripts/validate_numpy_abi.py" \
            --expected-major "${{ matrix.numpy_min_major }}"
          python -m pip check
          python -I -u "$GITHUB_WORKSPACE/benchmarks/numpy_abi_compat_bench.py" \
            --label "minimum-numpy" \
            --output "$GITHUB_WORKSPACE/numpy-compat-results/minimum.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-py${{ matrix.python }}
          path: |
            wheelhouse/*.whl
            numpy-compat-results/*.json
          if-no-files-found: error

  build_windows:
    name: Windows wheel (py${{ matrix.python }})
    if: ${{ !inputs.wheel_run_id }}
    needs: resolve_version
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy_min: "1.23.5"
            numpy_min_major: "1"
          - python: "3.11"
            numpy_min: "1.23.5"
            numpy_min_major: "1"
          - python: "3.12"
            numpy_min: "1.26.0"
            numpy_min_major: "1"
          - python: "3.13"
            numpy_min: "2.1.0"
            numpy_min_major: "2"
          - python: "3.14"
            numpy_min: "2.3.4"
            numpy_min_major: "2"
    env:
      PY: ${{ matrix.python }}
      CMAKE_GENERATOR: Ninja
      # See build_linux comment: we pin cmake<4 instead of using the
      # CMAKE_POLICY_VERSION_MINIMUM shim.
      # Must be CMAKE_ARGS (read by scikit-build-core); TAICHI_CMAKE_ARGS
      # is a silent no-op under the new build backend.
      # The Python PyPI wheel intentionally omits the C API package tree to
      # keep per-release PyPI storage bounded; C API artifacts should be built
      # and distributed separately when needed.
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_RUNTIME_C_API:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $version = "1.4.304.1"
          $installer = "$env:TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
          $expectedHash = "19cc78a4ba59fcd9339d83958e09662f8396a320e4a3e73660ed382627952bfb"
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Vulkan SDK SHA256 mismatch: expected=$expectedHash actual=$actualHash"
          }
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -WindowStyle Hidden -Wait
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "PATH=C:\VulkanSDK\$version\Bin;$env:PATH" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Download prebuilt LLVM 20
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $url = "${{ env.LLVM20_WIN_URL }}"
          $expectedHash = ("${{ env.LLVM20_WIN_SHA256 }}").ToLowerInvariant()
          if (-not $url) {
            Write-Error "LLVM20_WIN_URL is not configured as a repo variable. Run the 'Build LLVM 20 for Windows' workflow first and set the variable to the release asset URL."
            exit 1
          }
          if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
            throw "LLVM20_WIN_SHA256 must be configured as a 64-character repository variable."
          }
          New-Item -ItemType Directory -Force -Path dist/taichi-llvm-20 | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $env:TEMP/llvm20.zip
          $actualHash = (Get-FileHash -Algorithm SHA256 $env:TEMP/llvm20.zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM 20 SHA256 mismatch: expected=$expectedHash actual=$actualHash"
          }
          Expand-Archive -Path $env:TEMP/llvm20.zip -DestinationPath dist/taichi-llvm-20
          "LLVM_DIR=$(Resolve-Path dist/taichi-llvm-20/lib/cmake/llvm)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Install python build deps
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          python -m pip install "pip==26.2.1"
          # cmake<4 matches the VS2026-bundled CMake 3.x used by the local
          # Windows build. CMake 4 breaks vendored external/SPIRV-Tools.
          # numpy is required at configure time by PythonNumpyPybind11.cmake.
          python -m pip install --requirement packaging/constraints/release-build.txt
          python -c "import sys, sysconfig; print(sys.version); print(sysconfig.get_config_var('SOABI'))"
          python -m pip freeze

      - name: Override version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          Set-Content -Path version.txt -NoNewline -Value "${{ needs.resolve_version.outputs.version }}"
          Get-Content version.txt
          python scripts/sync_runtime_dependency.py --runtime-version "${{ needs.resolve_version.outputs.runtime_version }}"

      - name: Download published runtime for shim link
        if: ${{ needs.resolve_version.outputs.runtime_source == 'index' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $indexUrl = if ("${{ needs.resolve_version.outputs.target }}" -eq "testpypi") { "https://test.pypi.org/simple/" } else { "https://pypi.org/simple/" }
          python -m pip download --only-binary=:all: --no-deps --index-url $indexUrl `
            "taichi-forge-runtime==${{ needs.resolve_version.outputs.runtime_version }}" -d runtime-wheel

      - name: Download runtime artifact for shim link
        if: ${{ needs.resolve_version.outputs.runtime_source != 'index' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-windows-runtime
          path: runtime-wheel
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}

      - name: Extract runtime artifact for shim link
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path runtime-link | Out-Null

          python scripts/validate_runtime_wheel.py `
            --wheel-dir runtime-wheel --platform windows `
            --version "${{ needs.resolve_version.outputs.runtime_version }}" `
            --dependency-class driver-only --export-manifest-schema 2 `
            --strict-binary

          @'
          from pathlib import Path
          from shutil import copyfileobj
          from zipfile import ZipFile

          wheels = sorted(Path("runtime-wheel").glob("taichi_forge_runtime-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one runtime wheel, found {len(wheels)}: {wheels}")

          required = {
              "taichi_runtime.dll": Path("runtime-link/taichi_runtime.dll"),
              "taichi_runtime.lib": Path("runtime-link/taichi_runtime.lib"),
          }
          with ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              for leaf, target in required.items():
                  members = [name for name in names if name.endswith("/" + leaf)]
                  if len(members) != 1:
                      raise SystemExit(f"Expected one {leaf} in {wheels[0]}, found {members}")
                  with zf.open(members[0]) as src, target.open("wb") as dst:
                      copyfileobj(src, dst)
                  print(f"Extracted {members[0]} from {wheels[0]} -> {target}")
          '@ | python -

          $runtimeDir = (Resolve-Path runtime-link).Path.Replace('\', '/')
          "CMAKE_ARGS=$($env:CMAKE_ARGS) -DTI_PREBUILT_PYTHON_RUNTIME_DIR=$runtimeDir" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          Get-ChildItem -Path runtime-link

      - name: Build wheel
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          # Isolated mode drops cwd from sys.path so the local build.py
          # does not shadow the PyPI `build` package.
          python -I -m build --wheel --no-isolation

      - name: Validate installed runtime and shim wheels
        env:
          TI_NATIVE_RUNTIME_LOAD_TRACE: "1"
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $pythonTag = "cp$($env:PY.Replace('.', ''))"
          python scripts/validate_shim_wheel.py `
            --wheel-dir dist --platform windows `
            --python-tag $pythonTag --runtime-version "${{ needs.resolve_version.outputs.runtime_version }}" --strict-binary
          $runtimeWheel = (Get-ChildItem runtime-wheel\*.whl | Select-Object -First 1).FullName
          $shimWheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --only-binary=:all: `
            --constraint packaging/constraints/release-build.txt `
            $runtimeWheel $shimWheel
          python -m pip check
          New-Item -ItemType Directory -Force -Path numpy-compat-results | Out-Null
          Push-Location $env:TEMP
          try {
            python -I -u -X faulthandler "$env:GITHUB_WORKSPACE\scripts\validate_installed_runtime.py"
            python -I -u "$env:GITHUB_WORKSPACE\scripts\validate_numpy_abi.py" --expected-major 2
            python -I -u "$env:GITHUB_WORKSPACE\benchmarks\numpy_abi_compat_bench.py" `
              --label "build-numpy" `
              --output "$env:GITHUB_WORKSPACE\numpy-compat-results\build.json"
            python -m pip install --force-reinstall --no-deps "numpy==${{ matrix.numpy_min }}"
            python -I -u "$env:GITHUB_WORKSPACE\scripts\validate_numpy_abi.py" `
              --expected-major "${{ matrix.numpy_min_major }}"
            python -m pip check
            python -I -u "$env:GITHUB_WORKSPACE\benchmarks\numpy_abi_compat_bench.py" `
              --label "minimum-numpy" `
              --output "$env:GITHUB_WORKSPACE\numpy-compat-results\minimum.json"
          } finally {
            Pop-Location
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-windows-py${{ matrix.python }}
          path: |
            dist/*.whl
            numpy-compat-results/*.json
          if-no-files-found: error

  validate_wheel_set:
    name: Validate shim wheel set
    # A platform-scoped audit produces per-shim artifacts, not a release set.
    if: ${{ !cancelled() && needs.resolve_version.result == 'success' && inputs.validation_platform != 'windows' && (inputs.wheel_run_id || (needs.build_linux.result == 'success' && needs.build_windows.result == 'success')) }}
    needs: [resolve_version, build_linux, build_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Wheel-set validation is ABI-independent. Keep its tooling interpreter
      # aligned with the py3-none runtime build; individual shims are already
      # installed and validated under every matrix interpreter above.
      - name: Setup Python 3.13 release validation host
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install release validation dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install "packaging==26.0"

      - name: Download all wheel artifacts
        if: ${{ !inputs.wheel_run_id }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: wheel-*-py*

      - name: Reuse previously validated shim wheels
        if: ${{ inputs.wheel_run_id }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-shim-wheel-set
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.wheel_run_id }}

      - name: Gather wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name '*.whl' -exec cp -v {} dist/ \;
          python -m scripts.validate_release_wheel_set \
            --wheel-dir dist --version "${{ needs.resolve_version.outputs.version }}" \
            --project shim --runtime-version "${{ needs.resolve_version.outputs.runtime_version }}"
          ls -la dist/

      - name: Save validated wheel set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-shim-wheel-set
          path: dist/*.whl
          if-no-files-found: error
