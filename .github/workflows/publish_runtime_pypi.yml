name: Publish runtime wheels to PyPI

# Builds and optionally publishes the platform-native taichi-forge-runtime
# wheels. Run this workflow before publish_pypi.yml for the same version: the
# Python-facing taichi-forge workflow downloads this package from PyPI/TestPyPI
# and extracts the native library artifacts for shim linking.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.1 or 0.5.1rc1); leave empty to use version.txt"
        required: false
        default: ""
      publish:
        description: "Upload to PyPI after building (true/false)"
        required: false
        default: "false"
      target:
        description: "pypi | testpypi - which index to publish to"
        required: false
        default: "testpypi"

permissions:
  contents: read
  # Needed by pypa/gh-action-pypi-publish (Trusted Publishing / OIDC).
  id-token: write

env:
  TI_SKIP_VERSION_CHECK: "ON"
  TI_CI: "1"
  LLVM20_WIN_URL: ${{ vars.LLVM20_WIN_URL }}
  LLVM20_LINUX_MANYLINUX_URL: ${{ vars.LLVM20_LINUX_MANYLINUX_URL }}

jobs:
  resolve_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="$(tr -d ' \t\n' < version.txt)"
          fi
          echo "Resolved version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  build_linux_runtime:
    name: Linux runtime wheel
    needs: resolve_version
    runs-on: ubuntu-22.04
    env:
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_CUDA_TOOLKIT:BOOL=OFF
        -DTI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF
        -DTI_WITH_CUPTI:BOOL=OFF
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build ccache libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libx11-dev \
            libxrender-dev libgl-dev libtinfo-dev libxml2-dev

      - name: Install Vulkan SDK deps
        env:
          VULKAN_SDK_VERSION: "1.4.304.1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools xz-utils

          sdk_root="$RUNNER_TEMP/vulkan-sdk"
          sdk_archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          curl -fsSL \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz" \
            -o "$sdk_archive"
          rm -rf "$sdk_root"
          mkdir -p "$sdk_root"
          tar -xJf "$sdk_archive" -C "$sdk_root" --strip-components=1

          sdk="$sdk_root/x86_64"
          test -x "$sdk/bin/glslc"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "VK_SDK_PATH=$sdk" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/glslc" --version

      - name: Download prebuilt LLVM 20
        env:
          LLVM20_LINUX_URL: ${{ vars.LLVM20_LINUX_URL || env.LLVM20_LINUX_MANYLINUX_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${LLVM20_LINUX_URL}" ]]; then
            echo "::error::LLVM20_LINUX_URL (or LLVM20_LINUX_MANYLINUX_URL) is not configured as a repository variable."
            exit 1
          fi
          mkdir -p dist
          curl -fsSL "$LLVM20_LINUX_URL" -o /tmp/llvm20.zip
          mkdir -p dist/taichi-llvm-20
          python -m zipfile -e /tmp/llvm20.zip dist/taichi-llvm-20
          echo "LLVM_DIR=$GITHUB_WORKSPACE/dist/taichi-llvm-20/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install python build deps
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --upgrade "scikit-build-core>=0.10" "cmake<4" "pybind11>=2.13" ninja numpy

      - name: Override version
        shell: bash
        run: |
          echo -n "${{ needs.resolve_version.outputs.version }}" > version.txt
          cat version.txt
          python scripts/sync_runtime_dependency.py

      - name: Build runtime wheel
        run: |
          python -I -m build --wheel --no-isolation --outdir dist-runtime packaging/runtime

      - name: Validate runtime native build options
        run: |
          set -euo pipefail
          cache="$(find _skbuild -name CMakeCache.txt | sort | head -n 1)"
          if [[ -z "$cache" ]]; then
            echo "::error::CMakeCache.txt was not generated."
            exit 1
          fi
          grep -F "TI_WITH_CUDA_TOOLKIT:BOOL=OFF" "$cache"
          grep -F "TI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF" "$cache"
          grep -F "TI_WITH_CUPTI:BOOL=OFF" "$cache"
          grep -F "TI_WITH_VULKAN:BOOL=ON" "$cache"

      - name: Repair runtime wheel contents
        run: |
          set -euo pipefail
          build_dir="$(find _skbuild -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/CMakeCache.txt' \; -print)"
          if [[ -z "$build_dir" || "$(printf '%s\n' "$build_dir" | wc -l)" -ne 1 ]]; then
              echo "::error::Expected exactly one top-level runtime build directory, found: $build_dir"
              exit 1
          fi
          python scripts/repair_runtime_wheel.py \
            --wheel-dir dist-runtime --platform linux --build-dir "$build_dir"

      - name: Validate runtime wheel contents
        run: |
          set -euo pipefail
          python scripts/validate_runtime_wheel.py \
            --wheel-dir dist-runtime --platform linux \
            --dependency-class driver-only

      - name: Reject implicit CUDA Toolkit shared-library imports
        run: |
          set -euo pipefail
          runtime_so="$(find _skbuild -name libtaichi_runtime.so -type f | sort | head -n 1)"
          test -n "$runtime_so"
          readelf -d "$runtime_so" | tee /tmp/runtime-needed.txt
          if grep -Ei 'NEEDED.*lib(cudart|cupti|nvrtc|cublas|cusparse|curand|cufft|cusolver|nvjitlink)' /tmp/runtime-needed.txt; then
            echo "::error::libtaichi_runtime.so has an implicit CUDA Toolkit dependency."
            exit 1
          fi

      - name: Audit runtime wheel
        run: |
          set -euo pipefail
          python -m pip install auditwheel patchelf
          mkdir -p wheelhouse-runtime
          auditwheel show dist-runtime/*.whl || true
          auditwheel repair dist-runtime/*.whl -w wheelhouse-runtime/ --plat manylinux_2_35_x86_64
          python scripts/repair_runtime_wheel.py \
            --wheel-dir wheelhouse-runtime --platform manylinux
          auditwheel show wheelhouse-runtime/*.whl
          python scripts/validate_runtime_wheel.py \
            --wheel-dir wheelhouse-runtime --platform manylinux \
            --dependency-class driver-only

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-runtime
          path: wheelhouse-runtime/*.whl
          if-no-files-found: error

  build_windows_runtime:
    name: Windows runtime wheel
    needs: resolve_version
    runs-on: windows-2022
    env:
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_CUDA_TOOLKIT:BOOL=OFF
        -DTI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF
        -DTI_WITH_CUPTI:BOOL=OFF
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.304.1"
          $installer = "$env:TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "PATH=C:\VulkanSDK\$version\Bin;$env:PATH" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Download prebuilt LLVM 20
        shell: pwsh
        run: |
          $url = "${{ env.LLVM20_WIN_URL }}"
          if (-not $url) {
            Write-Error "LLVM20_WIN_URL is not configured as a repo variable. Run the 'Build LLVM 20 for Windows' workflow first and set the variable to the release asset URL."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist/taichi-llvm-20 | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $env:TEMP/llvm20.zip
          Expand-Archive -Path $env:TEMP/llvm20.zip -DestinationPath dist/taichi-llvm-20
          "LLVM_DIR=$(Resolve-Path dist/taichi-llvm-20/lib/cmake/llvm)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Install python build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --upgrade "scikit-build-core>=0.10" "cmake<4" "pybind11>=2.13" numpy

      - name: Override version
        shell: pwsh
        run: |
          Set-Content -Path version.txt -NoNewline -Value "${{ needs.resolve_version.outputs.version }}"
          Get-Content version.txt
          python scripts/sync_runtime_dependency.py

      - name: Build runtime wheel
        shell: pwsh
        run: |
          python -I -m build --wheel --no-isolation --outdir dist-runtime packaging/runtime

      - name: Validate runtime native build options
        shell: pwsh
        run: |
          $cache = Get-ChildItem -Path _skbuild -Recurse -File -Filter CMakeCache.txt |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $cache) {
            Write-Error "CMakeCache.txt was not generated."
            exit 1
          }
          $content = Get-Content -Path $cache.FullName -Raw
          foreach ($expected in @(
              "TI_WITH_CUDA_TOOLKIT:BOOL=OFF",
              "TI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF",
              "TI_WITH_CUPTI:BOOL=OFF",
              "TI_WITH_VULKAN:BOOL=ON"
            )) {
            if (-not $content.Contains($expected)) {
              Write-Error "Expected CMake cache entry was not found: $expected"
              exit 1
            }
          }

      - name: Repair runtime wheel contents
        shell: pwsh
        run: |
          $buildDirs = @(Get-ChildItem -Path _skbuild -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "CMakeCache.txt")
          })
          if ($buildDirs.Count -ne 1) {
            Write-Error "Expected exactly one top-level runtime build directory, found: $($buildDirs.FullName -join ', ')"
            exit 1
          }
          python scripts/repair_runtime_wheel.py `
            --wheel-dir dist-runtime --platform windows --build-dir $buildDirs[0].FullName

      - name: Validate runtime wheel contents
        shell: pwsh
        run: |
          python scripts/validate_runtime_wheel.py `
            --wheel-dir dist-runtime --platform windows `
            --dependency-class driver-only

      - name: Reject implicit CUDA Toolkit DLL imports
        shell: pwsh
        run: |
          $runtimeDlls = @(Get-ChildItem -Path runtimes -Recurse `
            -Filter taichi_runtime.dll)
          if ($runtimeDlls.Count -ne 1) {
            Write-Error "Expected one built taichi_runtime.dll, found: $($runtimeDlls.FullName -join ', ')"
            exit 1
          }
          $imports = & dumpbin /dependents $runtimeDlls[0].FullName 2>&1
          if ($LASTEXITCODE -ne 0) {
            $imports | Write-Output
            Write-Error "dumpbin failed for $($runtimeDlls[0].FullName)"
            exit 1
          }
          $imports | Write-Output
          $toolkitDlls = @($imports | Where-Object {
            $_ -match '(?i)\b(?:cudart64_|cupti64_|nvrtc64_|cublas(?:lt)?64_|cusparse64_|curand64_|cufft64_|cusolver64_|nvjitlink_)[^\s]*\.dll\b'
          })
          if ($toolkitDlls.Count -ne 0) {
            Write-Error "taichi_runtime.dll has implicit CUDA Toolkit dependencies: $($toolkitDlls -join ', ')"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-runtime
          path: dist-runtime/*.whl
          if-no-files-found: error

  collect_and_publish:
    name: PyPI upload
    needs: [resolve_version, build_linux_runtime, build_windows_runtime]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish == 'true'
    environment:
      name: ${{ github.event.inputs.target == 'pypi' && 'pypi' || 'testpypi' }}
      url: ${{ github.event.inputs.target == 'pypi' && 'https://pypi.org/p/taichi-forge-runtime' || 'https://test.pypi.org/p/taichi-forge-runtime' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all runtime wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name '*.whl' -exec cp -v {} dist/ \;
          python scripts/validate_runtime_wheel.py \
            --wheel-dir dist --platform pair \
            --dependency-class driver-only
          ls -la dist/

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          packages-dir: dist

      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist
