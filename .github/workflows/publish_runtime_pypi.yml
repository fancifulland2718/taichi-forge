name: Build runtime wheel artifacts

# Builds platform-native taichi-forge-runtime wheels without publishing them.
# publish_pypi.yml calls this workflow, validates every CPython shim against
# these artifacts, and only then publishes both projects.

on:
  workflow_call:
    inputs:
      version:
        description: "Version resolved by the caller"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.6.3 or 0.6.3rc1); leave empty to use version.txt"
        required: false
        default: ""

permissions:
  contents: read

env:
  TI_SKIP_VERSION_CHECK: "ON"
  TI_CI: "1"
  # OptiX device code is PTX-JITed by the display driver. CUDA 12.5 emits PTX
  # 8.5, preserving the oldest qualified OptiX 8.1 / R555 runtime floor.
  CUDA_TOOLKIT_VERSION: "12.5.1"
  LLVM20_WIN_URL: ${{ vars.LLVM20_WIN_URL }}
  LLVM20_LINUX_MANYLINUX_URL: ${{ vars.LLVM20_LINUX_MANYLINUX_URL }}
  LLVM20_WIN_SHA256: ${{ vars.LLVM20_WIN_SHA256 }}
  LLVM20_LINUX_SHA256: ${{ vars.LLVM20_LINUX_SHA256 }}

jobs:
  resolve_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          else
            ver="$(tr -d ' \t\n' < version.txt)"
          fi
          ver="${ver#forge-v}"
          ver="${ver#v}"
          echo "Resolved version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  build_linux_runtime:
    name: Linux runtime wheel
    needs: resolve_version
    runs-on: ubuntu-22.04
    env:
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_CUDA_TOOLKIT:BOOL=OFF
        -DTI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF
        -DTI_WITH_CUPTI:BOOL=OFF
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_PYTHON:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The runtime artifact is py3-none and is separately audited for any
      # CPython imports. Use the common 3.13 tooling host; only the shim matrix
      # in publish_pypi.yml varies with the target CPython ABI.
      - name: Setup Python 3.13 tooling host
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install CUDA Toolkit build compiler
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network
          log-file-suffix: linux-runtime-optix.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build ccache libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libx11-dev \
            libxrender-dev libgl-dev libtinfo-dev libxml2-dev

      - name: Install Vulkan SDK deps
        env:
          VULKAN_SDK_VERSION: "1.4.304.1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools xz-utils

          sdk_root="$RUNNER_TEMP/vulkan-sdk"
          sdk_archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          curl -fsSL \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz" \
            -o "$sdk_archive"
          echo "92d698f12a968b024e2b593037830262785b2b734553683457719d4da7c5b0d6  $sdk_archive" | sha256sum -c -
          rm -rf "$sdk_root"
          mkdir -p "$sdk_root"
          tar -xJf "$sdk_archive" -C "$sdk_root" --strip-components=1

          sdk="$sdk_root/x86_64"
          test -x "$sdk/bin/glslc"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "VK_SDK_PATH=$sdk" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/glslc" --version

      - name: Download prebuilt LLVM 20
        env:
          LLVM20_LINUX_URL: ${{ vars.LLVM20_LINUX_URL || env.LLVM20_LINUX_MANYLINUX_URL }}
          LLVM20_LINUX_SHA256: ${{ env.LLVM20_LINUX_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${LLVM20_LINUX_URL}" ]]; then
            echo "::error::LLVM20_LINUX_URL (or LLVM20_LINUX_MANYLINUX_URL) is not configured as a repository variable."
            exit 1
          fi
          if [[ ! "${LLVM20_LINUX_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::LLVM20_LINUX_SHA256 must be configured as a 64-character repository variable."
            exit 1
          fi
          mkdir -p dist
          curl -fsSL "$LLVM20_LINUX_URL" -o /tmp/llvm20.zip
          echo "${LLVM20_LINUX_SHA256,,}  /tmp/llvm20.zip" | sha256sum -c -
          mkdir -p dist/taichi-llvm-20
          python -m zipfile -e /tmp/llvm20.zip dist/taichi-llvm-20
          echo "LLVM_DIR=$GITHUB_WORKSPACE/dist/taichi-llvm-20/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install python build deps
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install --requirement packaging/constraints/release-build.txt
          python -m pip install --require-hashes --no-deps \
            --requirement packaging/constraints/cudss-build.txt
          python -c "import sys, sysconfig; print(sys.version); print(sysconfig.get_config_var('SOABI'))"
          python -m pip freeze

      - name: Override version
        shell: bash
        run: |
          echo -n "${{ needs.resolve_version.outputs.version }}" > version.txt
          cat version.txt
          python scripts/sync_runtime_dependency.py

      - name: Build runtime wheel
        run: |
          nvcc -V
          python -I -m build --wheel --no-isolation --outdir dist-runtime packaging/runtime

      - name: Validate runtime native build options
        run: |
          set -euo pipefail
          cache="$(find _skbuild -name CMakeCache.txt | sort | head -n 1)"
          if [[ -z "$cache" ]]; then
            echo "::error::CMakeCache.txt was not generated."
            exit 1
          fi
          grep -F "TI_WITH_CUDA_TOOLKIT:BOOL=OFF" "$cache"
          grep -F "TI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF" "$cache"
          grep -F "TI_WITH_CUPTI:BOOL=OFF" "$cache"
          grep -F "TI_BUILD_BUNDLED_OPTIX_PROVIDERS:BOOL=ON" "$cache"
          grep -F "TI_BUILD_BUNDLED_CUDSS_PROVIDER:BOOL=ON" "$cache"
          grep -F "TI_BUILD_BUNDLED_OPTIONAL_RUNTIME_PROVIDERS:BOOL=ON" "$cache"
          grep -F "TI_ALLOW_UNQUALIFIED_OPTIX_PTX_TOOLKIT:BOOL=OFF" "$cache"
          grep -F "TI_WITH_CUDA:BOOL=ON" "$cache"
          grep -F "TI_WITH_VULKAN:BOOL=ON" "$cache"
          grep -F "TI_WITH_OPENGL:BOOL=ON" "$cache"
          grep -F "TI_WITH_LLVM:BOOL=ON" "$cache"
          grep -F "TI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON" "$cache"
          grep -F "TI_WITH_PYTHON:BOOL=ON" "$cache"
          grep -F "TI_WITH_C_API:BOOL=OFF" "$cache"
          grep -F "TI_BUILD_TESTS:BOOL=OFF" "$cache"

      - name: Repair runtime wheel contents
        run: |
          set -euo pipefail
          build_dir="$(find _skbuild -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/CMakeCache.txt' \; -print)"
          if [[ -z "$build_dir" || "$(printf '%s\n' "$build_dir" | wc -l)" -ne 1 ]]; then
              echo "::error::Expected exactly one top-level runtime build directory, found: $build_dir"
              exit 1
          fi
          python scripts/repair_runtime_wheel.py \
            --wheel-dir dist-runtime --platform linux --build-dir "$build_dir"

      - name: Validate runtime wheel contents
        run: |
          set -euo pipefail
          python scripts/validate_runtime_wheel.py \
            --wheel-dir dist-runtime --platform linux \
            --dependency-class driver-only --strict-binary

      - name: Reject implicit CUDA Toolkit shared-library imports
        run: |
          set -euo pipefail
          runtime_so="$(find _skbuild -name libtaichi_runtime.so -type f | sort | head -n 1)"
          test -n "$runtime_so"
          readelf -d "$runtime_so" | tee /tmp/runtime-needed.txt
          if grep -Ei 'NEEDED.*lib(cudart|cupti|nvrtc|cublas|cusparse|curand|cufft|cusolver|nvjitlink|cudss|amgxsh|nccl|cutensor)' /tmp/runtime-needed.txt; then
            echo "::error::libtaichi_runtime.so has an implicit CUDA Toolkit dependency."
            exit 1
          fi
          if grep -Ei 'NEEDED.*libpython' /tmp/runtime-needed.txt; then
            echo "::error::py3-none runtime wheel depends on libpython."
            exit 1
          fi
          if nm -D --undefined-only "$runtime_so" | grep -E '[[:space:]]_?Py[A-Za-z0-9_]*(@.*)?$'; then
            echo "::error::py3-none runtime wheel has unresolved CPython symbols."
            exit 1
          fi
          mapfile -t hardware_providers < <(
            find build _skbuild -type f \
              -name 'libtaichi_forge_*_provider_abi*_*.so' | sort -u
          )
          if [[ "${#hardware_providers[@]}" -ne 7 ]]; then
            echo "::error::Expected seven bundled hardware adapters, found: ${hardware_providers[*]}"
            exit 1
          fi
          for provider_so in "${hardware_providers[@]}"; do
            readelf -d "$provider_so" | tee /tmp/hardware-provider-needed.txt
            if grep -Ei 'NEEDED.*lib(cudart|cupti|nvrtc|cublas|cusparse|curand|cufft|cusolver|nvjitlink|nvoptix|cudss|amgxsh|nccl|cutensor)' /tmp/hardware-provider-needed.txt; then
              echo "::error::$provider_so has an implicit vendor runtime dependency."
              exit 1
            fi
            if grep -Ei 'NEEDED.*libpython' /tmp/hardware-provider-needed.txt; then
              echo "::error::$provider_so depends on CPython."
              exit 1
            fi
          done

      - name: Audit runtime wheel
        run: |
          set -euo pipefail
          mkdir -p wheelhouse-runtime
          auditwheel show dist-runtime/*.whl || true
          auditwheel repair dist-runtime/*.whl -w wheelhouse-runtime/ --plat manylinux_2_35_x86_64
          python scripts/repair_runtime_wheel.py \
            --wheel-dir wheelhouse-runtime --platform manylinux
          auditwheel show wheelhouse-runtime/*.whl
          python scripts/validate_runtime_wheel.py \
            --wheel-dir wheelhouse-runtime --platform manylinux \
            --dependency-class driver-only --strict-binary

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-runtime
          path: wheelhouse-runtime/*.whl
          if-no-files-found: error

  build_windows_runtime:
    name: Windows runtime wheel
    needs: resolve_version
    runs-on: windows-2022
    env:
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_CUDA_TOOLKIT:BOOL=OFF
        -DTI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF
        -DTI_WITH_CUPTI:BOOL=OFF
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_PYTHON:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Keep the ABI-independent runtime build on the same tooling host as
      # Linux and release-set validation.
      - name: Setup Python 3.13 tooling host
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install CUDA Toolkit build compiler
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network
          log-file-suffix: windows-runtime-optix.txt

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.304.1"
          $installer = "$env:TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
          $expectedHash = "19cc78a4ba59fcd9339d83958e09662f8396a320e4a3e73660ed382627952bfb"
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Vulkan SDK SHA256 mismatch: expected=$expectedHash actual=$actualHash"
          }
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -WindowStyle Hidden -Wait
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "PATH=C:\VulkanSDK\$version\Bin;$env:PATH" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Download prebuilt LLVM 20
        shell: pwsh
        run: |
          $url = "${{ env.LLVM20_WIN_URL }}"
          $expectedHash = ("${{ env.LLVM20_WIN_SHA256 }}").ToLowerInvariant()
          if (-not $url) {
            Write-Error "LLVM20_WIN_URL is not configured as a repo variable. Run the 'Build LLVM 20 for Windows' workflow first and set the variable to the release asset URL."
            exit 1
          }
          if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
            throw "LLVM20_WIN_SHA256 must be configured as a 64-character repository variable."
          }
          New-Item -ItemType Directory -Force -Path dist/taichi-llvm-20 | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $env:TEMP/llvm20.zip
          $actualHash = (Get-FileHash -Algorithm SHA256 $env:TEMP/llvm20.zip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "LLVM 20 SHA256 mismatch: expected=$expectedHash actual=$actualHash"
          }
          Expand-Archive -Path $env:TEMP/llvm20.zip -DestinationPath dist/taichi-llvm-20
          "LLVM_DIR=$(Resolve-Path dist/taichi-llvm-20/lib/cmake/llvm)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Install python build deps
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install --requirement packaging/constraints/release-build.txt
          python -m pip install --require-hashes --no-deps `
            --requirement packaging/constraints/cudss-build.txt
          python -c "import sys, sysconfig; print(sys.version); print(sysconfig.get_config_var('SOABI'))"
          python -m pip freeze

      - name: Override version
        shell: pwsh
        run: |
          Set-Content -Path version.txt -NoNewline -Value "${{ needs.resolve_version.outputs.version }}"
          Get-Content version.txt
          python scripts/sync_runtime_dependency.py

      - name: Build runtime wheel
        shell: pwsh
        run: |
          nvcc -V
          python -I -m build --wheel --no-isolation --outdir dist-runtime packaging/runtime

      - name: Validate runtime native build options
        shell: pwsh
        run: |
          $cache = Get-ChildItem -Path _skbuild -Recurse -File -Filter CMakeCache.txt |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $cache) {
            Write-Error "CMakeCache.txt was not generated."
            exit 1
          }
          $content = Get-Content -Path $cache.FullName -Raw
          foreach ($expected in @(
              "TI_WITH_CUDA_TOOLKIT:BOOL=OFF",
              "TI_WITH_CUDA_TOOLKIT_PRIMITIVE_REFERENCE:BOOL=OFF",
              "TI_WITH_CUPTI:BOOL=OFF",
              "TI_BUILD_BUNDLED_OPTIX_PROVIDERS:BOOL=ON",
              "TI_BUILD_BUNDLED_CUDSS_PROVIDER:BOOL=ON",
              "TI_BUILD_BUNDLED_OPTIONAL_RUNTIME_PROVIDERS:BOOL=ON",
              "TI_ALLOW_UNQUALIFIED_OPTIX_PTX_TOOLKIT:BOOL=OFF",
              "TI_WITH_CUDA:BOOL=ON",
              "TI_WITH_VULKAN:BOOL=ON",
              "TI_WITH_OPENGL:BOOL=ON",
              "TI_WITH_LLVM:BOOL=ON",
              "TI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON",
              "TI_WITH_PYTHON:BOOL=ON",
              "TI_WITH_C_API:BOOL=OFF",
              "TI_BUILD_TESTS:BOOL=OFF"
            )) {
            if (-not $content.Contains($expected)) {
              Write-Error "Expected CMake cache entry was not found: $expected"
              exit 1
            }
          }

      - name: Repair runtime wheel contents
        shell: pwsh
        run: |
          $buildDirs = @(Get-ChildItem -Path _skbuild -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "CMakeCache.txt")
          })
          if ($buildDirs.Count -ne 1) {
            Write-Error "Expected exactly one top-level runtime build directory, found: $($buildDirs.FullName -join ', ')"
            exit 1
          }
          python scripts/repair_runtime_wheel.py `
            --wheel-dir dist-runtime --platform windows --build-dir $buildDirs[0].FullName

      - name: Validate runtime wheel contents
        shell: pwsh
        run: |
          python scripts/validate_runtime_wheel.py `
            --wheel-dir dist-runtime --platform windows `
            --dependency-class driver-only --strict-binary

      - name: Reject implicit CUDA Toolkit DLL imports
        shell: pwsh
        run: |
          $runtimeDlls = @(Get-ChildItem -Path runtimes -Recurse `
            -Filter taichi_runtime.dll)
          if ($runtimeDlls.Count -ne 1) {
            Write-Error "Expected one built taichi_runtime.dll, found: $($runtimeDlls.FullName -join ', ')"
            exit 1
          }
          $imports = & dumpbin /dependents $runtimeDlls[0].FullName 2>&1
          if ($LASTEXITCODE -ne 0) {
            $imports | Write-Output
            Write-Error "dumpbin failed for $($runtimeDlls[0].FullName)"
            exit 1
          }
          $imports | Write-Output
          $toolkitDlls = @($imports | Where-Object {
            $_ -match '(?i)\b(?:cudart64_|cupti64_|nvrtc64_|cublas(?:lt)?64_|cusparse(?:lt)?64_|curand64_|cufft64_|cusolver64_|nvjitlink_|cudss64_|amgxsh|nccl|cutensor(?:mg)?(?:64_)?)[^\s]*\.dll\b'
          })
          if ($toolkitDlls.Count -ne 0) {
            Write-Error "taichi_runtime.dll has implicit CUDA Toolkit dependencies: $($toolkitDlls -join ', ')"
            exit 1
          }
          $pythonDlls = @($imports | Where-Object {
            $_ -match '(?i)\bpython3(?:\d+)?\.dll\b'
          })
          if ($pythonDlls.Count -ne 0) {
            Write-Error "py3-none runtime wheel depends on CPython: $($pythonDlls -join ', ')"
            exit 1
          }
          $hardwareProviders = @(Get-ChildItem -Path build,_skbuild -Recurse `
            -Filter "taichi_forge_*_provider_abi*_*.dll" |
            Sort-Object FullName -Unique)
          if ($hardwareProviders.Count -ne 7) {
            Write-Error "Expected seven bundled hardware adapters, found: $($hardwareProviders.FullName -join ', ')"
            exit 1
          }
          foreach ($provider in $hardwareProviders) {
            $providerImports = & dumpbin /dependents $provider.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              $providerImports | Write-Output
              Write-Error "dumpbin failed for $($provider.FullName)"
              exit 1
            }
            $providerImports | Write-Output
            $forbidden = @($providerImports | Where-Object {
              $_ -match '(?i)\b(?:cudart64_|cupti64_|nvrtc64_|cublas(?:lt)?64_|cusparse(?:lt)?64_|curand64_|cufft64_|cusolver64_|nvjitlink_|nvoptix|cudss64_|amgxsh|nccl|cutensor(?:mg)?(?:64_)?)[^\s]*\.dll\b'
            })
            if ($forbidden.Count -ne 0) {
              Write-Error "$($provider.FullName) has implicit vendor runtime dependencies: $($forbidden -join ', ')"
              exit 1
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-windows-runtime
          path: dist-runtime/*.whl
          if-no-files-found: error
