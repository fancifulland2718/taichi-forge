name: Publish runtime wheels to PyPI

# Builds and optionally publishes the platform-native taichi-forge-runtime
# wheels. Run this workflow before publish_pypi.yml for the same version: the
# Python-facing taichi-forge workflow downloads this package from PyPI/TestPyPI
# and extracts the native library artifacts for shim linking.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.4.2 or 0.4.2.dev20260609); leaves empty for version.txt"
        required: false
        default: ""
      publish:
        description: "Upload to PyPI after building (true/false)"
        required: false
        default: "false"
      target:
        description: "pypi | testpypi - which index to publish to"
        required: false
        default: "testpypi"

permissions:
  contents: read
  # Needed by pypa/gh-action-pypi-publish (Trusted Publishing / OIDC).
  id-token: write

env:
  TI_SKIP_VERSION_CHECK: "ON"
  TI_CI: "1"
  # Runtime wheels bind against the CUDART built and packaged by this workflow;
  # end users do not need a system CUDA Toolkit. Keep the version in one
  # overridable setting while older-Toolkit compatibility is validated.
  CUDA_TOOLKIT_VERSION: "13.2.0"
  LLVM20_WIN_URL: ${{ vars.LLVM20_WIN_URL }}
  LLVM20_LINUX_MANYLINUX_URL: ${{ vars.LLVM20_LINUX_MANYLINUX_URL }}

jobs:
  resolve_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="$(tr -d ' \t\n' < version.txt)"
          fi
          echo "Resolved version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  build_linux_runtime:
    name: Linux runtime wheel
    needs: resolve_version
    runs-on: ubuntu-22.04
    env:
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_CUDA_TOOLKIT:BOOL=ON
        -DTI_CUDA_CUB_SORT_DYNAMIC_CUDART:BOOL=ON
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build ccache libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libx11-dev \
            libxrender-dev libgl-dev libtinfo-dev libxml2-dev

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network
          log-file-suffix: linux-runtime.txt

      - name: Validate CUDA Toolkit
        run: |
          set -euo pipefail
          nvcc -V | tee /tmp/nvcc-version.txt
          IFS='.' read -r cuda_major cuda_minor _ <<< "${CUDA_TOOLKIT_VERSION}"
          expected_release="${cuda_major}.${cuda_minor}"
          grep -E "release ${expected_release//./\\.}([,[:space:]]|$)" /tmp/nvcc-version.txt
          test -n "${CUDA_PATH:-}"
          test -x "$CUDA_PATH/bin/nvcc"

      - name: Install Vulkan SDK deps
        env:
          VULKAN_SDK_VERSION: "1.4.304.1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools xz-utils

          sdk_root="$RUNNER_TEMP/vulkan-sdk"
          sdk_archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          curl -fsSL \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz" \
            -o "$sdk_archive"
          rm -rf "$sdk_root"
          mkdir -p "$sdk_root"
          tar -xJf "$sdk_archive" -C "$sdk_root" --strip-components=1

          sdk="$sdk_root/x86_64"
          test -x "$sdk/bin/glslc"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "VK_SDK_PATH=$sdk" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/glslc" --version

      - name: Download prebuilt LLVM 20
        env:
          LLVM20_LINUX_URL: ${{ vars.LLVM20_LINUX_URL || env.LLVM20_LINUX_MANYLINUX_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${LLVM20_LINUX_URL}" ]]; then
            echo "::error::LLVM20_LINUX_URL (or LLVM20_LINUX_MANYLINUX_URL) is not configured as a repository variable."
            exit 1
          fi
          mkdir -p dist
          curl -fsSL "$LLVM20_LINUX_URL" -o /tmp/llvm20.zip
          mkdir -p dist/taichi-llvm-20
          python -m zipfile -e /tmp/llvm20.zip dist/taichi-llvm-20
          echo "LLVM_DIR=$GITHUB_WORKSPACE/dist/taichi-llvm-20/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install python build deps
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --upgrade "scikit-build-core>=0.10" "cmake<4" "pybind11>=2.13" ninja numpy

      - name: Override version
        shell: bash
        run: |
          echo -n "${{ needs.resolve_version.outputs.version }}" > version.txt
          cat version.txt
          python scripts/sync_runtime_dependency.py

      - name: Build runtime wheel
        run: |
          python -I -m build --wheel --no-isolation --outdir dist-runtime packaging/runtime

      - name: Validate runtime native build options
        run: |
          set -euo pipefail
          cache="$(find _skbuild -name CMakeCache.txt | sort | head -n 1)"
          if [[ -z "$cache" ]]; then
            echo "::error::CMakeCache.txt was not generated."
            exit 1
          fi
          grep -F "TI_WITH_CUDA_TOOLKIT:BOOL=ON" "$cache"
          grep -F "TI_CUDA_CUB_SORT_DYNAMIC_CUDART:BOOL=ON" "$cache"
          grep -F "TI_WITH_VULKAN:BOOL=ON" "$cache"
          grep -F "CUDAToolkit_NVCC_EXECUTABLE:" "$cache"

      - name: Repair runtime wheel contents
        run: |
          set -euo pipefail
          build_dir="$(find _skbuild -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/CMakeCache.txt' \; -print)"
          if [[ -z "$build_dir" || "$(printf '%s\n' "$build_dir" | wc -l)" -ne 1 ]]; then
              echo "::error::Expected exactly one top-level runtime build directory, found: $build_dir"
              exit 1
          fi
          python scripts/repair_runtime_wheel.py \
            --wheel-dir dist-runtime --platform linux --build-dir "$build_dir"

      - name: Validate runtime wheel contents
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          from zipfile import ZipFile

          wheels = sorted(Path("dist-runtime").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one runtime wheel, found {[str(w) for w in wheels]}")

          wheel = wheels[0]
          if not wheel.name.startswith("taichi_forge_runtime-"):
              raise SystemExit(f"CUDA-specific or unexpected runtime wheel name: {wheel.name}")
          expected = "taichi_forge_runtime/_lib/runtime_native/libtaichi_runtime.so"
          expected_manifest = (
              "taichi_forge_runtime/_lib/runtime_native/"
              "cuda_runtime_major.txt"
          )
          with ZipFile(wheel) as zf:
              names = zf.namelist()
              manifest_value = (
                  zf.read(expected_manifest).decode("ascii").strip()
                  if expected_manifest in names
                  else None
              )
          runtime_libs = [name for name in names if name == expected]
          manifests = [name for name in names if name == expected_manifest]
          cuda_major = os.environ["CUDA_TOOLKIT_VERSION"].split(".", 1)[0]
          cudart_prefix = (
              "taichi_forge_runtime/_lib/runtime_native/"
              f"libcudart.so.{cuda_major}"
          )
          all_cuda_runtime_libs = [
              name for name in names
              if re.fullmatch(
                  r"libcudart\.so\.\d+(?:\.\d+)*", Path(name).name
              )
          ]
          cuda_runtime_libs = [
              name for name in all_cuda_runtime_libs
              if name.startswith(cudart_prefix)
          ]
          wrong_entries = [name for name in names if name.startswith("taichi_forge/_lib/")]
          if (
              len(runtime_libs) != 1
              or len(cuda_runtime_libs) != 1
              or len(all_cuda_runtime_libs) != 1
              or len(manifests) != 1
              or manifest_value != cuda_major
              or wrong_entries
          ):
              print(f"Runtime wheel contents from {wheel}:")
              for name in names:
                  if "taichi_runtime" in name or "cudart" in name or "_lib/" in name:
                      print(f"  {name}")
              built = sorted(Path("_skbuild").rglob("libtaichi_runtime.so"))
              if built:
                  print("Built runtime libraries under _skbuild:")
                  for path in built:
                      print(f"  {path}")
              raise SystemExit(
                  f"Expected {expected}, one dynamic libcudart, and no taichi_forge/_lib entries; "
                  f"found runtime_libs={runtime_libs}, cuda_runtime_libs={all_cuda_runtime_libs}, "
                  f"manifest={manifest_value!r}, wrong_entries={wrong_entries}"
              )
          print(f"Runtime wheel native library: {runtime_libs[0]}")
          print(f"Runtime wheel CUDA runtime: {cuda_runtime_libs[0]}")
          PY

      - name: Audit runtime wheel
        run: |
          set -euo pipefail
          python -m pip install auditwheel patchelf
          mkdir -p wheelhouse-runtime
          auditwheel show dist-runtime/*.whl || true
          auditwheel repair dist-runtime/*.whl -w wheelhouse-runtime/ --plat manylinux_2_35_x86_64
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("wheelhouse-runtime").glob("*.whl"))
          if not wheels:
              raise SystemExit("No repaired runtime wheels found")
          for wheel in wheels:
              if "linux_x86_64" in wheel.name or "manylinux" not in wheel.name:
                  raise SystemExit(f"Unsupported Linux runtime wheel tag: {wheel.name}")
              print(f"Linux runtime upload candidate: {wheel.name}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-runtime
          path: wheelhouse-runtime/*.whl
          if-no-files-found: error

  build_windows_runtime:
    name: Windows runtime wheel
    needs: resolve_version
    runs-on: windows-2022
    env:
      CMAKE_ARGS: >-
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_WITH_OPENGL:BOOL=ON
        -DTI_WITH_CUDA:BOOL=ON
        -DTI_WITH_CUDA_TOOLKIT:BOOL=ON
        -DTI_CUDA_CUB_SORT_DYNAMIC_CUDART:BOOL=ON
        -DTI_WITH_LLVM:BOOL=ON
        -DTI_WITH_SPLIT_PYTHON_RUNTIME:BOOL=ON
        -DTI_WITH_C_API:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: network
          log-file-suffix: windows-runtime.txt

      - name: Validate CUDA Toolkit
        shell: pwsh
        run: |
          $nvccVersion = (nvcc -V) -join "`n"
          $nvccVersion
          $versionParts = $env:CUDA_TOOLKIT_VERSION.Split(".")
          $expectedRelease = "$($versionParts[0]).$($versionParts[1])"
          $expectedPattern = "release\s+$([regex]::Escape($expectedRelease))([,\s]|$)"
          if ($nvccVersion -notmatch $expectedPattern) {
            Write-Error "Expected CUDA Toolkit $expectedRelease, got: $nvccVersion"
            exit 1
          }
          if (-not $env:CUDA_PATH) {
            Write-Error "CUDA_PATH was not configured by the CUDA Toolkit action."
            exit 1
          }
          $nvcc = Join-Path $env:CUDA_PATH "bin\nvcc.exe"
          if (-not (Test-Path $nvcc)) {
            Write-Error "nvcc.exe was not found under CUDA_PATH: $nvcc"
            exit 1
          }

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.304.1"
          $installer = "$env:TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "PATH=C:\VulkanSDK\$version\Bin;$env:PATH" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Download prebuilt LLVM 20
        shell: pwsh
        run: |
          $url = "${{ env.LLVM20_WIN_URL }}"
          if (-not $url) {
            Write-Error "LLVM20_WIN_URL is not configured as a repo variable. Run the 'Build LLVM 20 for Windows' workflow first and set the variable to the release asset URL."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist/taichi-llvm-20 | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $env:TEMP/llvm20.zip
          Expand-Archive -Path $env:TEMP/llvm20.zip -DestinationPath dist/taichi-llvm-20
          "LLVM_DIR=$(Resolve-Path dist/taichi-llvm-20/lib/cmake/llvm)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Install python build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --upgrade "scikit-build-core>=0.10" "cmake<4" "pybind11>=2.13" numpy

      - name: Override version
        shell: pwsh
        run: |
          Set-Content -Path version.txt -NoNewline -Value "${{ needs.resolve_version.outputs.version }}"
          Get-Content version.txt
          python scripts/sync_runtime_dependency.py

      - name: Build runtime wheel
        shell: pwsh
        run: |
          python -I -m build --wheel --no-isolation --outdir dist-runtime packaging/runtime

      - name: Validate runtime native build options
        shell: pwsh
        run: |
          $cache = Get-ChildItem -Path _skbuild -Recurse -File -Filter CMakeCache.txt |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $cache) {
            Write-Error "CMakeCache.txt was not generated."
            exit 1
          }
          $content = Get-Content -Path $cache.FullName -Raw
          foreach ($expected in @(
              "TI_WITH_CUDA_TOOLKIT:BOOL=ON",
              "TI_CUDA_CUB_SORT_DYNAMIC_CUDART:BOOL=ON",
              "TI_WITH_VULKAN:BOOL=ON",
              "CUDAToolkit_NVCC_EXECUTABLE:"
            )) {
            if (-not $content.Contains($expected)) {
              Write-Error "Expected CMake cache entry was not found: $expected"
              exit 1
            }
          }

      - name: Repair runtime wheel contents
        shell: pwsh
        run: |
          $buildDirs = @(Get-ChildItem -Path _skbuild -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "CMakeCache.txt")
          })
          if ($buildDirs.Count -ne 1) {
            Write-Error "Expected exactly one top-level runtime build directory, found: $($buildDirs.FullName -join ', ')"
            exit 1
          }
          python scripts/repair_runtime_wheel.py `
            --wheel-dir dist-runtime --platform windows --build-dir $buildDirs[0].FullName

      - name: Validate runtime wheel contents
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import re
          from zipfile import ZipFile

          wheels = sorted(Path("dist-runtime").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one runtime wheel, found {[str(w) for w in wheels]}")

          wheel = wheels[0]
          if not wheel.name.startswith("taichi_forge_runtime-"):
              raise SystemExit(f"CUDA-specific or unexpected runtime wheel name: {wheel.name}")
          expected_dll = "taichi_forge_runtime/_lib/runtime_native/taichi_runtime.dll"
          expected_lib = "taichi_forge_runtime/_lib/runtime_native/taichi_runtime.lib"
          expected_manifest = (
              "taichi_forge_runtime/_lib/runtime_native/"
              "cuda_runtime_major.txt"
          )
          with ZipFile(wheel) as zf:
              names = zf.namelist()
              manifest_value = (
                  zf.read(expected_manifest).decode("ascii").strip()
                  if expected_manifest in names
                  else None
              )
          runtime_dlls = [name for name in names if name == expected_dll]
          runtime_libs = [name for name in names if name == expected_lib]
          manifests = [name for name in names if name == expected_manifest]
          cuda_major = os.environ["CUDA_TOOLKIT_VERSION"].split(".", 1)[0]
          expected_cudart = (
              "taichi_forge_runtime/_lib/runtime_native/"
              f"cudart64_{cuda_major}.dll"
          )
          all_cuda_runtime_dlls = [
              name for name in names
              if re.fullmatch(r"cudart64_\d+\.dll", Path(name).name, re.IGNORECASE)
          ]
          cuda_runtime_dlls = [
              name for name in all_cuda_runtime_dlls
              if name == expected_cudart
          ]
          wrong_entries = [name for name in names if name.startswith("taichi_forge/_lib/")]
          if (
              len(runtime_dlls) != 1
              or len(runtime_libs) != 1
              or len(cuda_runtime_dlls) != 1
              or len(all_cuda_runtime_dlls) != 1
              or len(manifests) != 1
              or manifest_value != cuda_major
              or wrong_entries
          ):
              print(f"Runtime wheel contents from {wheel}:")
              for name in names:
                  if "taichi_runtime" in name or "cudart" in name or "_lib/" in name:
                      print(f"  {name}")
              raise SystemExit(
                  f"Expected {expected_dll}, {expected_lib}, one dynamic cudart DLL, "
                  f"and no taichi_forge/_lib entries; found dlls={runtime_dlls}, "
                  f"libs={runtime_libs}, cuda_runtime_dlls={all_cuda_runtime_dlls}, "
                  f"manifest={manifest_value!r}, wrong_entries={wrong_entries}"
              )
          print(f"Runtime wheel native DLL: {runtime_dlls[0]}")
          print(f"Runtime wheel import library: {runtime_libs[0]}")
          print(f"Runtime wheel CUDA runtime DLL: {cuda_runtime_dlls[0]}")
          '@ | python -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-runtime
          path: dist-runtime/*.whl
          if-no-files-found: error

  collect_and_publish:
    name: PyPI upload
    needs: [resolve_version, build_linux_runtime, build_windows_runtime]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish == 'true'
    environment:
      name: ${{ github.event.inputs.target == 'pypi' && 'pypi' || 'testpypi' }}
      url: ${{ github.event.inputs.target == 'pypi' && 'https://pypi.org/p/taichi-forge-runtime' || 'https://test.pypi.org/p/taichi-forge-runtime' }}
    steps:
      - name: Download all runtime wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name '*.whl' -exec cp -v {} dist/ \;
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import re
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 2:
              raise SystemExit(
                  "Expected exactly one Windows and one Linux runtime wheel, "
                  f"found {[wheel.name for wheel in wheels]}"
              )
          versions = set()
          for wheel in wheels:
              if not wheel.name.startswith("taichi_forge_runtime-"):
                  raise SystemExit(
                      f"CUDA-specific or unexpected runtime wheel name: {wheel.name}"
                  )
              with ZipFile(wheel) as zf:
                  names = zf.namelist()
                  metadata = next(name for name in names if name.endswith(".dist-info/METADATA"))
                  parsed = Parser().parsestr(
                      zf.read(metadata).decode("utf-8", errors="replace")
                  )
                  project = parsed.get("Name")
                  versions.add(parsed.get("Version"))
                  manifests = [
                      name for name in names
                      if name.endswith("/cuda_runtime_major.txt")
                  ]
                  if len(manifests) != 1:
                      raise SystemExit(
                          f"Expected one CUDA runtime manifest in {wheel.name}, "
                          f"found {manifests}"
                      )
                  major_text = zf.read(manifests[0]).decode("ascii").strip()
                  if not major_text.isdigit() or int(major_text) <= 0:
                      raise SystemExit(
                          f"Invalid CUDA runtime manifest in {wheel.name}: "
                          f"{major_text!r}"
                      )
                  major = int(major_text)
                  if "win_amd64" in wheel.name:
                      cudart_pattern = re.compile(
                          r"cudart64_(\d+)\.dll", re.IGNORECASE
                      )
                      native_name = "taichi_runtime.dll"
                  else:
                      cudart_pattern = re.compile(
                          r"libcudart(?:-[^.]+)?\.so\.(\d+)(?:\.\d+)*",
                          re.IGNORECASE,
                      )
                      native_name = "libtaichi_runtime.so"
                  cudarts = []
                  for name in names:
                      match = cudart_pattern.fullmatch(Path(name).name)
                      if match:
                          cudarts.append((name, int(match.group(1))))
                  native_runtimes = [
                      name for name in names
                      if Path(name).name == native_name
                  ]
                  if (
                      len(cudarts) != 1
                      or cudarts[0][1] != major
                      or len(native_runtimes) != 1
                  ):
                      raise SystemExit(
                          f"Runtime contents mismatch in {wheel.name}: "
                          f"manifest major={major}, cudarts={cudarts}, "
                          f"native_runtimes={native_runtimes}"
                      )
              if project != "taichi-forge-runtime":
                  raise SystemExit(f"Unexpected wheel project {project!r}: {wheel}")
              if "linux_x86_64" in wheel.name:
                  raise SystemExit(f"Unsupported Linux platform tag in upload set: {wheel.name}")
          if len(versions) != 1:
              raise SystemExit(f"Runtime wheel versions differ: {sorted(versions)}")
          if sum("win_amd64" in wheel.name for wheel in wheels) != 1:
              raise SystemExit("Expected exactly one Windows runtime wheel")
          if sum("manylinux" in wheel.name for wheel in wheels) != 1:
              raise SystemExit("Expected exactly one manylinux runtime wheel")
          print(f"taichi-forge-runtime: {len(wheels)} wheel(s)")
          PY
          ls -la dist/

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          packages-dir: dist

      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist
