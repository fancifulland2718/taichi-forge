name: GitHub Release / GitHub 发行

# PyPI remains in the two existing, already-bound publisher workflows.
# This workflow only assembles and publishes GitHub assets after PyPI succeeds.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      runtime_version:
        type: string
        required: true
      shim_run_id:
        type: string
        required: true
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "Released taichi-forge version (matching forge-v tag required)"
        type: string
        required: true
      runtime_version:
        description: "Published runtime version used by these shims"
        type: string
        required: true
      shim_run_id:
        description: "Existing publish_pypi.yml run whose PyPI upload succeeded"
        type: string
        required: true
      publish:
        description: "Publish GitHub assets; false only assembles the attachment bundle"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-github-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging==26.0
      - name: Download published shim candidates / 获取已发布主包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-shim-wheel-set
          path: wheels
          github-token: ${{ github.token }}
          run-id: ${{ inputs.shim_run_id }}
      - name: Download runtime and verify both published packages / 核对两包
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          for platform in win_amd64 manylinux_2_35_x86_64; do
            python -m pip download --only-binary=:all: --no-deps --index-url https://pypi.org/simple/ \
              --platform "$platform" "taichi-forge-runtime==$RUNTIME_VERSION" -d wheels
          done
          python -m scripts.validate_release_wheel_set --wheel-dir wheels --version "$VERSION" --runtime-version "$RUNTIME_VERSION"
          python scripts/check_pypi_version_available.py --repository pypi --wheel-dir wheels --upload-dir missing --require-published
      - name: Resolve actual publisher provenance / 核对实际构建来源
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          SHIM_RUN_ID: ${{ inputs.shim_run_id }}
        run: |
          python -m scripts.release_github resolve-sources --directory wheels --run-id "$SHIM_RUN_ID" \
            --version "$VERSION" --runtime-version "$RUNTIME_VERSION"
      - name: Check out tagged public source / 获取固定源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: source
          submodules: recursive
          fetch-depth: 0
      - name: Assemble sources, docs, bilingual notes and hashes / 整理附件
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          python -m scripts.release_artifacts build --root source --ref "refs/tags/forge-v$VERSION" \
            --runtime-version "$RUNTIME_VERSION" --wheels wheels --output release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 90

  github_release:
    needs: bundle
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging==26.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: release
      - name: Publish verified GitHub attachments / 发布已核对附件
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.bundle.outputs.commit }}
        run: |
          set -euo pipefail
          python scripts/check_pypi_version_available.py --repository pypi --wheel-dir release --upload-dir missing --require-published
          python -m scripts.release_github stage --directory release --version "$VERSION" --commit "$SOURCE_COMMIT"
          python -m scripts.release_github publish --directory release --version "$VERSION" --commit "$SOURCE_COMMIT"
          echo "### $VERSION — GitHub Release 已发布 / Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Both packages were already published by their existing PyPI workflows. / 两包已由原有流程发布至 PyPI。" >> "$GITHUB_STEP_SUMMARY"
